<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | strip_html | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.subtitle | default: site.description | strip_html | normalize_whitespace | escape }}">
  {%- feed_meta %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Fira+Mono:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap">

  {%- comment -%} ?v= change à chaque build : le navigateur recharge le CSS après chaque mise en ligne {%- endcomment -%}
  {%- assign css_version = site.time | date: '%s' %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ css_version }}">
  {%- if include.extra_css %}
  <link rel="stylesheet" href="{{ include.extra_css | prepend: '/assets/css/' | relative_url }}?v={{ css_version }}">
  {%- endif %}

  {% include analytics.html %}
</head>
